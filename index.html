<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>BTH Trainer Scanner</title>

  <!-- QR herkenning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .uitleg {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #bbb;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #scannerScherm {
      display: none;
      text-align: center;
    }

    .trainerLabel {
      color: #666;
      margin-bottom: 5px;
    }

    .trainerNaam {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .cameraBox {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }

    #camera {
      display: block;
      width: 100%;
      min-height: 280px;
      object-fit: cover;
    }

    .scanKader {
      position: absolute;
      width: 65%;
      aspect-ratio: 1 / 1;
      max-height: 80%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid white;
      border-radius: 16px;
      box-sizing: border-box;
      pointer-events: none;
    }

    #canvas {
      display: none;
    }

    .cameraTekst {
      margin-top: 12px;
      color: #555;
    }

    .status {
      margin-top: 15px;
      padding: 16px;
      border-radius: 12px;
      background: #e8e8e8;
      word-break: break-word;
    }

    .gevonden {
      background: #e1f5e5;
      color: #155724;
      text-align: left;
    }

    .fout {
      background: #ffe2e2;
      color: #8b0000;
      text-align: left;
    }

    .statusTitel {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #volgendKnop {
      display: none;
      background: #222;
    }

    .wijzig {
      background: #ddd;
      color: #222;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>BTH Trainer Scanner</h1>

    <!-- TRAINER -->

    <div id="loginScherm">

      <div class="uitleg">
        Identificeer jezelf voordat je leden scant.
      </div>

      <label for="trainerNaam">
        Voornaam en naam
      </label>

      <input
        id="trainerNaam"
        type="text"
        placeholder="bv. Ulricke Beuselinck"
        autocomplete="name"
      >

      <button onclick="bewaarTrainer()">
        START SCANNER
      </button>

    </div>


    <!-- SCANNER -->

    <div id="scannerScherm">

      <div class="trainerLabel">
        Ingelogde trainer
      </div>

      <div
        class="trainerNaam"
        id="actieveTrainer">
      </div>

      <div
        class="cameraBox"
        id="cameraBox">

        <video
          id="camera"
          autoplay
          playsinline
          muted>
        </video>

        <div class="scanKader"></div>

      </div>

      <canvas id="canvas"></canvas>

      <div class="cameraTekst">
        Houd de QR-code van het lid in het kader.
      </div>

      <div
        class="status"
        id="status">
        Camera wordt gestart...
      </div>

      <button
        id="volgendKnop"
        onclick="volgendLid()">
        VOLGEND LID
      </button>

      <button
        class="wijzig"
        onclick="wijzigTrainer()">
        Andere trainer
      </button>

    </div>

  </div>

</div>


<script>

const TRAINER_STORAGE =
  "bth_trainerNaam_v9";

let cameraStream = null;
let scannerActief = false;
let qrVerwerkt = false;


/* ========================================
   TRAINER
======================================== */

function bewaarTrainer() {

  const naam =
    document
      .getElementById("trainerNaam")
      .value
      .trim();

  if (!naam) {

    alert(
      "Vul eerst je voornaam en naam in."
    );

    return;
  }

  localStorage.setItem(
    TRAINER_STORAGE,
    naam
  );

  toonScanner(naam);
}


function toonScanner(naam) {

  document
    .getElementById("loginScherm")
    .style.display = "none";

  document
    .getElementById("scannerScherm")
    .style.display = "block";

  document
    .getElementById("actieveTrainer")
    .textContent = naam;

  startCamera();
}


async function wijzigTrainer() {

  stopCamera();

  localStorage.removeItem(
    TRAINER_STORAGE
  );

  document
    .getElementById("scannerScherm")
    .style.display = "none";

  document
    .getElementById("loginScherm")
    .style.display = "block";

  document
    .getElementById("trainerNaam")
    .value = "";
}


/* ========================================
   CAMERA
======================================== */

async function startCamera() {

  stopCamera();

  qrVerwerkt = false;

  const status =
    document.getElementById("status");

  const volgendKnop =
    document.getElementById("volgendKnop");

  status.className = "status";

  status.innerHTML =
    "Camera wordt gestart...";

  volgendKnop.style.display =
    "none";


  if (typeof jsQR === "undefined") {

    status.className =
      "status fout";

    status.innerHTML =
      "<strong>QR-scanner kon niet worden geladen.</strong>";

    return;
  }


  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false
      });


    const video =
      document.getElementById("camera");

    video.srcObject =
      cameraStream;

    await video.play();


    scannerActief = true;


    status.innerHTML =
      "Zoeken naar QR-code...";


    requestAnimationFrame(
      scanFrame
    );


  } catch (fout) {

    scannerActief = false;

    status.className =
      "status fout";

    status.innerHTML =
      "<strong>Camera kon niet worden geopend.</strong><br><br>" +
      veilig(
        (fout.name || "") +
        " - " +
        (fout.message || String(fout))
      );
  }
}


function stopCamera() {

  scannerActief = false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {
        track.stop();
      });

    cameraStream = null;
  }


  const video =
    document.getElementById("camera");

  if (video) {
    video.srcObject = null;
  }
}


/* ========================================
   QR ZOEKEN
======================================== */

function scanFrame() {

  if (
    !scannerActief ||
    qrVerwerkt
  ) {

    return;
  }


  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("canvas");

  const context =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    if (
      code &&
      code.data
    ) {

      qrGevonden(
        code.data
      );

      return;
    }
  }


  requestAnimationFrame(
    scanFrame
  );
}


/* ========================================
   QR GEVONDEN
======================================== */

function qrGevonden(inhoud) {

  if (qrVerwerkt) {
    return;
  }


  qrVerwerkt = true;

  stopCamera();


  const status =
    document.getElementById("status");


  status.className =
    "status gevonden";


  status.innerHTML =

    '<div class="statusTitel">' +
      '✓ QR HERKEND' +
    '</div>' +

    '<div>' +
      'De QR-code werd correct gelezen.' +
    '</div>' +

    '<div style="margin-top:12px;">' +
      '<strong>Inhoud:</strong>' +
    '</div>' +

    '<div>' +
      veilig(inhoud) +
    '</div>';


  document
    .getElementById("volgendKnop")
    .style.display = "block";
}


/* ========================================
   VOLGEND LID
======================================== */

function volgendLid() {

  startCamera();
}


/* ========================================
   VEILIGE TEKST
======================================== */

function veilig(tekst) {

  const div =
    document.createElement("div");

  div.textContent =
    String(tekst || "");

  return div.innerHTML;
}


/* ========================================
   START
======================================== */

window.addEventListener(
  "load",
  function() {

    const bestaandeNaam =
      localStorage.getItem(
        TRAINER_STORAGE
      );


    if (bestaandeNaam) {

      toonScanner(
        bestaandeNaam
      );
    }
  }
);

</script>

</body>
</html>
