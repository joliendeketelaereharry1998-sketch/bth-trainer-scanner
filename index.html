<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BTH Trainer Scanner</title><meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BTH Scanner">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font:17px Arial,sans-serif;color:#222}.container{max-width:520px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 12px #0002}h1{text-align:center;font-size:26px}p{line-height:1.5}label{display:block;font-weight:bold;margin:12px 0 7px}input{width:100%;padding:16px;border:1px solid #aaa;border-radius:10px;font-size:19px}button{display:block;width:100%;border:0;border-radius:12px;background:#222;color:#fff;font-size:19px;font-weight:700;padding:17px;margin-top:15px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#ddd;color:#222;font-size:15px}.cameraBox{position:relative;border-radius:15px;overflow:hidden;background:#111}video{width:100%;min-height:260px;object-fit:cover;display:block}.kader{position:absolute;left:19%;top:12%;width:62%;height:76%;border:4px solid #fff;border-radius:16px;pointer-events:none}canvas{display:none}.status{margin-top:16px;padding:18px;border-radius:12px;background:#eee;overflow-wrap:anywhere}.status.error{background:#ffe0e0;color:#830000}.status.warn{background:#fff2ce;color:#624700}.status.ok{background:#dcf6e1;color:#14542a}.status.success{background:#11843a;color:white;text-align:center;padding:24px 15px}.status.success .headline{font-size:30px;line-height:1.2;font-weight:900;margin:12px 0 20px}.naam{font-size:24px;font-weight:bold;margin:10px 0}.small{font-size:14px;color:#666}.status.success .small{color:#fff}.status.alert{background:#fff0f0;color:#8b0000;border:4px solid #c91d1d;text-align:center;padding:24px 15px}.status.alert .headline{font-size:29px;line-height:1.2;font-weight:900;margin:10px 0 18px}.status.alert .probleem{background:#fff;border:2px solid #c91d1d;border-radius:10px;padding:13px 8px;margin:10px 0;font-size:20px;font-weight:900}.groep{font-size:19px;font-weight:800;margin:12px 0;padding:10px;border-radius:9px;background:#ffffff30;border:1px solid currentColor}.status.alert .bevestigd{color:#185b2d;font-size:17px;font-weight:bold;margin-top:20px}.detail{margin:10px 0;line-height:1.4}.balance{font-size:24px;font-weight:bold;margin-top:15px}#scannerScherm,#volgendKnop{display:none}
</style></head><body><div class="container"><div class="card"><h1>BTH Trainer Scanner</h1>
<div id="loginScherm"><p>Vul je naam in voordat je leden scant.</p><label for="trainerNaam">Voornaam en naam</label><input id="trainerNaam" autocomplete="name" placeholder="Voornaam en naam"><button id="startKnop">START SCANNER</button></div>
<div id="scannerScherm"><p class="small" style="text-align:center">Ingelogde trainer</p><div id="actieveTrainer" style="text-align:center;font-weight:bold;margin-bottom:15px"></div>
<div id="cameraBox" class="cameraBox"><video id="camera" autoplay playsinline muted></video><div class="kader"></div></div><canvas id="canvas"></canvas>
<p id="cameraTekst" class="small" style="text-align:center">Houd de QR-code in het kader.</p><div id="status" class="status">Camera wordt gestart...</div>
<button id="volgendKnop">VOLGEND LID</button><button id="wijzigKnop" class="secondary">Andere trainer</button></div></div></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbymCwS5CKRtUK7Vl0e7Gx_C3EWIhsUa-JSXGFDG8hjt2gl1u7Q_ew8WqkO24XAMevui/exec';
const STORAGE='bth_trainerNaam_v9';
let stream=null, actief=false, verwerkt=false, huidig=null, bezig=false, requestNr=0;
const el=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(html,cls=''){el('status').className='status '+cls;el('status').innerHTML=html;}
function toonVolgend(ja){el('volgendKnop').style.display=ja?'block':'none';el('volgendKnop').disabled=false;}
function stopCamera(){actief=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}el('camera').srcObject=null;}
async function startCamera(){stopCamera();verwerkt=false;huidig=null;bezig=false;toonVolgend(false);el('cameraBox').style.display='block';el('cameraTekst').style.display='block';setStatus('Camera wordt gestart...');if(typeof jsQR==='undefined'){setStatus('QR-scannerbibliotheek kon niet laden.','error');return;}
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});el('camera').srcObject=stream;await el('camera').play();actief=true;setStatus('Zoeken naar QR-code...');requestAnimationFrame(scanFrame);}catch(e){setStatus('Camera kon niet starten: '+esc(e.message||e),'error');}}
function scanFrame(){if(!actief||verwerkt)return;const v=el('camera'),c=el('canvas');if(v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0);const data=ctx.getImageData(0,0,c.width,c.height);const qr=jsQR(data.data,data.width,data.height,{inversionAttempts:'dontInvert'});if(qr&&qr.data){verwerkt=true;stopCamera();verwerkQr(qr.data);return;}}requestAnimationFrame(scanFrame);}
function rijUitQr(tekst){try{const u=new URL(tekst),n=Number(u.searchParams.get('row'));return Number.isInteger(n)&&n>=2?n:null;}catch(e){return null;}}
function api(params,timeout=30000){return new Promise((resolve,reject)=>{const callback='bthCb_'+Date.now()+'_'+(++requestNr);const script=document.createElement('script');let klaar=false;const opruim=()=>{if(script.parentNode)script.remove();delete window[callback];clearTimeout(timer);};window[callback]=r=>{if(klaar)return;klaar=true;opruim();resolve(r);};script.onerror=()=>{if(klaar)return;klaar=true;opruim();reject(Error('Verbindingsfout'));};const q=new URLSearchParams({...params,callback:callback,_:String(Date.now())});script.src=API_URL+'?'+q.toString();const timer=setTimeout(()=>{if(klaar)return;klaar=true;opruim();reject(Error('Antwoord duurt te lang'));},timeout);document.body.appendChild(script);});}
function trainer(){return (localStorage.getItem(STORAGE)||'').trim();}
function startLogin(){const naam=el('trainerNaam').value.trim();if(!naam){alert('Vul je voornaam en naam in.');return;}localStorage.setItem(STORAGE,naam);el('loginScherm').style.display='none';el('scannerScherm').style.display='block';el('actieveTrainer').textContent=naam;startCamera();}
function andereTrainer(){if(bezig)return;stopCamera();localStorage.removeItem(STORAGE);el('scannerScherm').style.display='none';el('loginScherm').style.display='block';el('trainerNaam').value='';}
async function verwerkQr(tekst){const row=rijUitQr(tekst);if(!row){setStatus('Geen geldige BTH leden-QR.','error');toonVolgend(true);return;}setStatus('<b>Lidgegevens ophalen...</b>');try{const r=await api({api:'lid',row});if(!r||!r.ok)throw Error(r&&r.fout||'Lid niet gevonden');huidig=r;if(r.alGeregistreerd){toonDubbel(r);return;}if(r.type==='Abonnement'){await registreerAbonnement();return;}toonBeurt(r);}catch(e){setStatus('Lid kon niet worden opgehaald: '+esc(e.message),'error');toonVolgend(true);}}
function groepHtml(r){return '<div class="groep">GROEP: '+esc(r.groep||'Niet ingevuld')+'</div>';}
function toonDubbel(r){el('cameraBox').style.display='none';el('cameraTekst').style.display='none';setStatus('<div class="headline">LID VANDAAG AL GEREGISTREERD</div><div class="naam">'+esc(r.volledigeNaam)+'</div><div>'+esc(r.lidnummer)+'</div>'+groepHtml(r)+'<p>Er is geen nieuwe aanwezigheid toegevoegd en geen extra beurt afgetrokken.</p>','warn');toonVolgend(true);}
function toonBeurt(r){setStatus('<div class="small">'+esc(r.lidnummer)+'</div><div class="naam">'+esc(r.volledigeNaam)+'</div>'+groepHtml(r)+'<div class="detail">Beurtenkaart · resterend: <b>'+esc(r.beurten)+'</b></div><div class="detail">Vervaldatum: '+esc(r.vervaldatum||'Niet ingevuld')+'</div><label for="trainerCode">Trainer code</label><input id="trainerCode" type="password" inputmode="numeric" autocomplete="off" placeholder="Trainer code"><button id="beurtKnop">1 BEURT AFTREKKEN</button>','ok');el('beurtKnop').addEventListener('click',registreerBeurt);toonVolgend(false);}
async function registreerBeurt(){if(bezig||!huidig)return;const code=el('trainerCode').value.trim();if(!code){alert('Vul de trainer code in.');return;}bezig=true;el('beurtKnop').disabled=true;setStatus('<b>Beurt wordt verwerkt...</b><p>Niet vernieuwen of opnieuw drukken.</p>');await registreer({api:'beurt',row:huidig.row,code:code,trainerNaam:trainer()},'beurt');}
async function registreerAbonnement(){if(bezig||!huidig)return;bezig=true;setStatus('<b>Aanwezigheid wordt geregistreerd...</b>');await registreer({api:'abonnement',row:huidig.row,trainerNaam:trainer()},'abonnement');}
async function registreer(params,soort){try{const r=await api(params,35000);if(!r||!r.ok){if(r&&r.onzeker){await controleerStatus(soort);return;}bezig=false;setStatus('<b>Registratie geweigerd.</b><p>'+esc(r&&r.fout||'Onbekende fout')+'</p><p>Geen automatische nieuwe poging.</p>','error');toonVolgend(true);return;}bezig=false;if(r.alGeregistreerd){toonDubbel({...huidig,...r});return;}toonSucces(r,soort);}catch(e){await controleerStatus(soort);}}
async function controleerStatus(soort){setStatus('<b>Antwoord vertraagd.</b><p>We controleren of de registratie al is uitgevoerd. Druk nergens opnieuw op.</p>','warn');try{const r=await api({api:'status',row:huidig.row},35000);bezig=false;if(r&&r.ok&&r.geregistreerd){toonSucces({volledigeNaam:r.volledigeNaam,lidnummer:r.lidnummer,resterend:r.resterend,alGeregistreerd:false},soort);return;}setStatus('<b>Registratie niet bevestigd.</b><p>Controleer in Google Sheets de aanwezigheid en het saldo vóór je opnieuw probeert.</p>','error');toonVolgend(true);}catch(e){bezig=false;setStatus('<b>Geen verbinding.</b><p>De registratie kan wel uitgevoerd zijn. Controleer eerst het tabblad Aanwezigheden en bij beurtenkaart kolom X. Niet opnieuw aftrekken.</p>','error');toonVolgend(true);}}
function toonSucces(r,soort){
  el('cameraBox').style.display='none';
  el('cameraTekst').style.display='none';
  const lid=huidig||r;
  const verzekering=String(lid.verzekering||'').trim().toLowerCase();
  const betaling=String(lid.geldigheid||'').trim().toLowerCase();
  // Dezelfde betaalwaarschuwingen als de bestaande werkende mailfunctie in Apps Script.
  const verzekeringFout=!verzekering||verzekering==='nee'||verzekering.includes('nog geen betaling ontvangen');
  const betalingFout=betaling.includes('nog geen betaling ontvangen');
  const kop=soort==='beurt'?'BEURT AFGETROKKEN!':'AANWEZIGHEID GEREGISTREERD!';
  let extra=soort==='beurt'?'<div class="balance">Resterende beurten: '+esc(r.resterend)+'</div>':'';
  if(soort==='beurt'&&r.vorig!=null)extra+='<div class="detail">Van '+esc(r.vorig)+' naar '+esc(r.resterend)+'</div>';
  const identiteit='<div class="naam">'+esc(r.volledigeNaam||lid.volledigeNaam)+'</div><div>'+esc(r.lidnummer||lid.lidnummer)+'</div>'+groepHtml(lid);
  if(verzekeringFout||betalingFout){
    let problemen='';
    if(verzekeringFout)problemen+='<div class="probleem">✖ VERZEKERING NIET IN ORDE</div>';
    if(betalingFout)problemen+='<div class="probleem">✖ LIDGELD NIET BETAALD</div>';
    setStatus('<div class="headline">⚠ LID NIET IN ORDE!</div>'+identiteit+problemen+
      '<p class="bevestigd">✓ '+kop+'</p>'+extra+
      '<p class="bevestigd">Aanwezigheid geregistreerd.</p>','alert');
  }else{
    setStatus('<div class="headline">✓ '+kop+'</div>'+identiteit+extra+
      '<p>Aanwezigheid geregistreerd.</p>','success');
  }
  toonVolgend(true);
}
el('startKnop').addEventListener('click',startLogin);el('volgendKnop').addEventListener('click',()=>{if(!bezig)startCamera();});el('wijzigKnop').addEventListener('click',andereTrainer);
window.addEventListener('load',()=>{const naam=trainer();if(naam){el('loginScherm').style.display='none';el('scannerScherm').style.display='block';el('actieveTrainer').textContent=naam;startCamera();}});
// Verwijder oude PWA-worker en cache zodat trainers geen verouderde versie blijven zien.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if ('caches' in window) caches.keys().then(keys=>keys.filter(k=>/bth|scanner/i.test(k)).forEach(k=>caches.delete(k))).catch(()=>{});
</script></body></html>
