<!DOCTYPE html>
<html lang="nl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>BTH Trainer Scanner</title>

  <!-- QR herkenning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .uitleg {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #bbb;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #scannerScherm {
      display: none;
      text-align: center;
    }

    .trainerLabel {
      color: #666;
      margin-bottom: 5px;
    }

    .trainerNaam {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .cameraBox {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }

    #camera {
      display: block;
      width: 100%;
      min-height: 280px;
      object-fit: cover;
    }

    .scanKader {
      position: absolute;
      width: 65%;
      aspect-ratio: 1 / 1;
      max-height: 80%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid white;
      border-radius: 16px;
      box-sizing: border-box;
      pointer-events: none;
    }

    #canvas {
      display: none;
    }

    .cameraTekst {
      margin-top: 12px;
      color: #555;
    }

    .status {
      margin-top: 15px;
      padding: 18px;
      border-radius: 12px;
      background: #e8e8e8;
      word-break: break-word;
      text-align: left;
    }

    .gevonden {
      background: #e1f5e5;
      color: #155724;
    }

    .waarschuwing {
      background: #fff3cd;
      color: #664d03;
    }

    .fout {
      background: #ffe2e2;
      color: #8b0000;
    }

    .statusTitel {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .lidnummer {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .lidnaam {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .regel {
      margin-top: 8px;
      line-height: 1.4;
    }

    .label {
      font-weight: bold;
    }

    .laden {
      text-align: center;
      color: #555;
    }

    #volgendKnop {
      display: none;
      background: #222;
    }

    .wijzig {
      background: #ddd;
      color: #222;
      font-size: 14px;
    }
    .beurtActie { margin-top:18px; padding-top:16px; border-top:1px solid #ddd; }
    .beurtActie input { margin-top:8px; text-align:center; }
    .beurtKnop { background:#155724; }
    .actieMelding { margin-top:12px; font-weight:bold; line-height:1.4; }
  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>BTH Trainer Scanner</h1>


    <!-- =====================================
         TRAINER
    ====================================== -->

    <div id="loginScherm">

      <div class="uitleg">
        Identificeer jezelf voordat je leden scant.
      </div>

      <label for="trainerNaam">
        Voornaam en naam
      </label>

      <input
        id="trainerNaam"
        type="text"
        placeholder="bv. Ulricke Beuselinck"
        autocomplete="name"
      >

      <button onclick="bewaarTrainer()">
        START SCANNER
      </button>

    </div>


    <!-- =====================================
         SCANNER
    ====================================== -->

    <div id="scannerScherm">

      <div class="trainerLabel">
        Ingelogde trainer
      </div>

      <div
        class="trainerNaam"
        id="actieveTrainer">
      </div>


      <div
        class="cameraBox"
        id="cameraBox">

        <video
          id="camera"
          autoplay
          playsinline
          muted>
        </video>

        <div class="scanKader"></div>

      </div>


      <canvas id="canvas"></canvas>


      <div class="cameraTekst">
        Houd de QR-code van het lid in het kader.
      </div>


      <div
        class="status"
        id="status">
        Camera wordt gestart...
      </div>


      <button
        id="volgendKnop"
        onclick="volgendLid()">
        VOLGEND LID
      </button>


      <button
        class="wijzig"
        onclick="wijzigTrainer()">
        Andere trainer
      </button>

    </div>

  </div>

</div>


<script>


/* =====================================================
   INSTELLINGEN
===================================================== */

const TRAINER_STORAGE =
  "bth_trainerNaam_v9";

const API_URL =
  "https://script.google.com/macros/s/AKfycbymCwS5CKRtUK7Vl0e7Gx_C3EWIhsUa-JSXGFDG8hjt2gl1u7Q_ew8WqkO24XAMevui/exec";

let cameraStream = null;

let scannerActief = false;

let qrVerwerkt = false;

let jsonpTeller = 0;


/* =====================================================
   TRAINER
===================================================== */

function bewaarTrainer() {

  const naam =
    document
      .getElementById("trainerNaam")
      .value
      .trim();


  if (!naam) {

    alert(
      "Vul eerst je voornaam en naam in."
    );

    return;
  }


  localStorage.setItem(
    TRAINER_STORAGE,
    naam
  );


  toonScanner(
    naam
  );
}


function toonScanner(naam) {

  document
    .getElementById("loginScherm")
    .style.display = "none";


  document
    .getElementById("scannerScherm")
    .style.display = "block";


  document
    .getElementById("actieveTrainer")
    .textContent = naam;


  startCamera();
}


async function wijzigTrainer() {

  stopCamera();


  localStorage.removeItem(
    TRAINER_STORAGE
  );


  document
    .getElementById("scannerScherm")
    .style.display = "none";


  document
    .getElementById("loginScherm")
    .style.display = "block";


  document
    .getElementById("trainerNaam")
    .value = "";
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

  stopCamera();


  qrVerwerkt = false;


  const status =
    document.getElementById(
      "status"
    );


  const volgendKnop =
    document.getElementById(
      "volgendKnop"
    );


  status.className =
    "status";


  status.innerHTML =
    "Camera wordt gestart...";


  volgendKnop.style.display =
    "none";


  if (
    typeof jsQR === "undefined"
  ) {

    toonFout(
      "QR-scanner kon niet worden geladen."
    );

    return;
  }


  try {

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false
        });


    const video =
      document.getElementById(
        "camera"
      );


    video.srcObject =
      cameraStream;


    await video.play();


    scannerActief =
      true;


    status.innerHTML =
      "Zoeken naar QR-code...";


    requestAnimationFrame(
      scanFrame
    );


  } catch (fout) {

    scannerActief =
      false;


    toonFout(
      "Camera kon niet worden geopend.<br><br>" +
      veilig(
        (fout.name || "") +
        " - " +
        (fout.message || String(fout))
      )
    );
  }
}


function stopCamera() {

  scannerActief =
    false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


    cameraStream =
      null;
  }


  const video =
    document.getElementById(
      "camera"
    );


  if (video) {
    video.srcObject = null;
  }
}


/* =====================================================
   QR ZOEKEN
===================================================== */

function scanFrame() {

  if (
    !scannerActief ||
    qrVerwerkt
  ) {
    return;
  }


  const video =
    document.getElementById(
      "camera"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const context =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    if (
      code &&
      code.data
    ) {

      qrGevonden(
        code.data
      );

      return;
    }
  }


  requestAnimationFrame(
    scanFrame
  );
}


/* =====================================================
   QR GEVONDEN
===================================================== */

function qrGevonden(inhoud) {

  if (qrVerwerkt) {
    return;
  }


  qrVerwerkt =
    true;


  stopCamera();


  const row =
    haalRijUitQr(
      inhoud
    );


  if (!row) {

    toonFout(
      "Deze QR-code is geen geldige BTH leden-QR."
    );


    document
      .getElementById(
        "volgendKnop"
      )
      .style.display =
        "block";


    return;
  }


  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status";


  status.innerHTML =
    '<div class="laden">' +
      '<strong>Lidgegevens ophalen...</strong>' +
      '<br><br>' +
      'Even geduld.' +
    '</div>';


  vraagLidOp(
    row
  );
}


/* =====================================================
   RIJNUMMER UIT QR HALEN
===================================================== */

function haalRijUitQr(inhoud) {

  try {

    const url =
      new URL(inhoud);


    /*
      Alleen QR-codes met een row parameter
      worden aanvaard.
    */

    const row =
      Number(
        url.searchParams.get(
          "row"
        )
      );


    if (
      !Number.isInteger(row) ||
      row < 2
    ) {

      return null;
    }


    return row;


  } catch (fout) {

    return null;
  }
}


/* =====================================================
   LID OPVRAGEN VIA JSONP
===================================================== */

function vraagLidOp(row) {

  jsonpTeller++;

  const callbackNaam =
    "bthLidCallback_" +
    Date.now() +
    "_" +
    jsonpTeller;

  let afgehandeld = false;

  const script =
    document.createElement("script");

  function opruimen() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackNaam];
    } catch (fout) {
      window[callbackNaam] = undefined;
    }
  }


  window[callbackNaam] =
    function(resultaat) {

      if (afgehandeld) {
        return;
      }

      afgehandeld = true;

      opruimen();


      if (
        !resultaat ||
        resultaat.ok !== true
      ) {

        toonFout(
          resultaat && resultaat.fout
            ? veilig(resultaat.fout)
            : "Lidgegevens konden niet worden opgehaald."
        );

        document
          .getElementById("volgendKnop")
          .style.display = "block";

        return;
      }


      toonLid(resultaat);
    };


  script.onerror =
    function() {

      if (afgehandeld) {
        return;
      }

      afgehandeld = true;

      opruimen();

      toonFout(
        "De ledenlijst kon niet worden bereikt. Probeer opnieuw."
      );

      document
        .getElementById("volgendKnop")
        .style.display = "block";
    };


  script.src =
    API_URL +
    "?api=lid" +
    "&row=" +
    encodeURIComponent(row) +
    "&callback=" +
    encodeURIComponent(callbackNaam) +
    "&_=" +
    Date.now();


  document.body.appendChild(script);


  setTimeout(
    function() {

      if (afgehandeld) {
        return;
      }

      afgehandeld = true;

      opruimen();

      toonFout(
        "Geen antwoord van de ledenlijst. Probeer opnieuw."
      );

      document
        .getElementById("volgendKnop")
        .style.display = "block";
    },

    10000
  );
}


/* =====================================================
   LID TONEN
===================================================== */

function toonLid(lid) {

  const status = document.getElementById("status");

  const nietBetaald =
    String(lid.geldigheid || "")
      .toLowerCase()
      .includes("nog geen betaling ontvangen");

  status.className =
    nietBetaald
      ? "status fout"
      : "status gevonden";

  let html = "";

  html +=
    '<div class="lidnummer">' +
      veilig(lid.lidnummer) +
    '</div>';

  html +=
    '<div class="lidnaam">' +
      veilig(lid.volledigeNaam) +
    '</div>';

  html +=
    '<div class="regel">' +
      '<span class="label">Type:</span> ' +
      veilig(lid.type) +
    '</div>';

  if (lid.type === "Beurtenkaart") {

    html +=
      '<div class="regel">' +
        '<span class="label">Resterende beurten:</span> ' +
        veilig(lid.beurten) +
      '</div>';

    html +=
      '<div class="regel">' +
        '<span class="label">Vervaldatum:</span> ' +
        veilig(lid.vervaldatum || "Niet ingevuld") +
      '</div>';

    html +=
      '<div class="beurtActie">' +
        '<div class="label">Trainer code</div>' +
        '<input id="trainerCode" type="password" inputmode="numeric" autocomplete="off" placeholder="Trainer code">' +
        '<button id="beurtKnop" class="beurtKnop" onclick="trekBeurtAf(' +
          Number(lid.row) +
        ')">1 BEURT AFTREKKEN</button>' +
        '<div id="actieMelding" class="actieMelding"></div>' +
      '</div>';

  } else {

    html +=
      '<div class="regel">' +
        '<span class="label">Geldigheid:</span> ' +
        veilig(lid.geldigheid || "Niet ingevuld") +
      '</div>';
  }

  if (nietBetaald) {
    html +=
      '<div class="regel" style="margin-top:14px;font-weight:bold;">' +
        '⚠ Nog geen betaling ontvangen.' +
      '</div>';
  }

  status.innerHTML = html;

  document
    .getElementById("volgendKnop")
    .style.display = "block";
}


/* =====================================================
   BEURT AFTREKKEN
===================================================== */

function trekBeurtAf(row) {

  const codeVeld =
    document.getElementById("trainerCode");

  const knop =
    document.getElementById("beurtKnop");

  const melding =
    document.getElementById("actieMelding");

  const code =
    codeVeld
      ? codeVeld.value.trim()
      : "";

  const trainerNaam =
    localStorage.getItem(TRAINER_STORAGE) || "";

  if (!trainerNaam.trim()) {
    melding.textContent =
      "Trainer niet geïdentificeerd.";
    return;
  }

  if (!code) {
    melding.textContent =
      "Vul eerst de trainer code in.";

    if (codeVeld) {
      codeVeld.focus();
    }

    return;
  }

  if (knop) {
    knop.disabled = true;
    knop.textContent = "BEZIG...";
  }

  melding.textContent =
    "Beurt verwerken...";

  jsonpTeller++;

  const callbackNaam =
    "bthBeurtCallback_" +
    Date.now() +
    "_" +
    jsonpTeller;

  let afgehandeld = false;

  const script =
    document.createElement("script");

  function opruimen() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackNaam];
    } catch (fout) {
      window[callbackNaam] = undefined;
    }
  }

  function herstelKnop() {

    if (knop) {
      knop.disabled = false;
      knop.textContent = "1 BEURT AFTREKKEN";
    }
  }

  window[callbackNaam] =
    function(resultaat) {

      if (afgehandeld) {
        return;
      }

      afgehandeld = true;
      opruimen();

      if (!resultaat || resultaat.ok !== true) {

        herstelKnop();

        melding.textContent =
          resultaat && resultaat.fout
            ? resultaat.fout
            : "Beurt kon niet worden afgetrokken.";

        return;
      }

      melding.innerHTML =
        '✓ Beurt afgetrokken.<br>' +
        'Resterende beurten: <strong>' +
        veilig(resultaat.resterend) +
        '</strong>';

      if (codeVeld) {
        codeVeld.value = "";
        codeVeld.disabled = true;
      }

      if (knop) {
        knop.style.display = "none";
      }

      setTimeout(
        function() {
          startCamera();
        },
        1500
      );
    };

  script.onerror =
    function() {

      if (afgehandeld) {
        return;
      }

      afgehandeld = true;
      opruimen();
      herstelKnop();

      melding.textContent =
        "Verbinding mislukt. Er werd geen bevestiging ontvangen.";
    };

  script.src =
    API_URL +
    "?api=beurt" +
    "&row=" +
    encodeURIComponent(row) +
    "&code=" +
    encodeURIComponent(code) +
    "&trainerNaam=" +
    encodeURIComponent(trainerNaam) +
    "&callback=" +
    encodeURIComponent(callbackNaam) +
    "&_=" +
    Date.now();

  document.body.appendChild(script);

  setTimeout(
    function() {

      if (afgehandeld) {
        return;
      }

      afgehandeld = true;
      opruimen();
      herstelKnop();

      melding.textContent =
        "Geen antwoord ontvangen. Controleer eerst het aantal beurten in het ledenbestand voordat je opnieuw probeert.";
    },
    10000
  );
}


/* =====================================================
   VOLGEND LID
===================================================== */

function volgendLid() {

  startCamera();
}


/* =====================================================
   FOUT
===================================================== */

function toonFout(tekst) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status fout";


  status.innerHTML =
    '<div class="statusTitel">' +
      'Scannerfout' +
    '</div>' +
    '<div>' +
      tekst +
    '</div>';
}


/* =====================================================
   VEILIGE TEKST
===================================================== */

function veilig(tekst) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      tekst || ""
    );


  return div.innerHTML;
}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function() {

    const bestaandeNaam =
      localStorage.getItem(
        TRAINER_STORAGE
      );


    if (bestaandeNaam) {

      toonScanner(
        bestaandeNaam
      );
    }
  }
);

</script>

</body>
</html>
